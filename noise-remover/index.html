            <p class="leading-relaxed">• Electrical Hum (50 Hz / 60 Hz): Caused by ground loops or unshielded cables. Can often be eliminated with a steep notch filter.</p><p class="leading-relaxed">• White / Pink Noise Hiss: High-frequency analog preamp noise. Best addressed with spectral subtraction or multi-band expanders.</p><p class="leading-relaxed">• Room Reverberation: Echoes from bare walls and reflective surfaces. Requires deep learning de-reverberation algorithms.</p>
