        <p class="text-lg text-slate-600 max-w-2xl mx-auto">VocalRemover.group was founded by audio engineers, developers, and music creators with a clear objective: build high-quality, privacy-respecting audio separation tools that run directly in your browser without subscriptions, paywalls, or cloud data tracking.</p>

          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">Our Mission: Democratizing Professional Audio Separation</h2>
            <p class="leading-relaxed">High-grade audio source separation used to require high-end workstations with dedicated desktop GPUs or expensive monthly software subscriptions. Many online services took advantage of this by forcing users into recurring billing plans, throttling free users, and uploading copyrighted songs to opaque cloud servers.</p><p class="leading-relaxed">We believe creators should have access to state-of-the-art music tools without sacrificing privacy, autonomy, or money. By porting advanced deep learning architectures directly to the browser via WebGPU and WASM, we eliminated the expensive server costs that force other platforms to charge subscriptions. Test our tools with the <a href="/" class="text-indigo-600 hover:underline font-semibold">AI Vocal Remover</a> and <a href="/instrumental-maker/" class="text-indigo-600 hover:underline font-semibold">Instrumental Maker</a>.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">Why We Built a 100% Client-Side Architecture</h2>
            <p class="leading-relaxed">When audio files are uploaded to cloud servers, they can be stored, analyzed, leaked, or scraped. For musicians protecting unreleased demos or content creators safeguarding private recordings, remote uploads represent a critical privacy vulnerability.</p><p class="leading-relaxed">Our architecture runs entirely within the client's browser memory space. Your audio stays on your hardware. Audio stays on your device in browser mode. Cloud processing, when available, requires a separate confirmation. Review our full <a href="/privacy-policy/" class="text-indigo-600 hover:underline font-semibold">Privacy Policy</a> for our security commitments.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">The Technology Under the Hood</h2>
            <p class="leading-relaxed">Our platform is built on modern web standards:</p><p class="leading-relaxed">• React 19 + TypeScript + Vite: Ultra-fast, lightweight single-page application with prerendered static SEO routes.</p><p class="leading-relaxed">• ONNX Runtime Web: Microsoft's high-performance machine learning inference engine for WebGPU and WebAssembly.</p><p class="leading-relaxed">• Meta AI HTDemucs v4: State-of-the-art hybrid transformer deep neural network for source separation.</p><p class="leading-relaxed">• Web Audio API &amp; In-Place Cooley-Tukey FFT: High-speed temporal-frequency analysis with custom overlap-add synthesis.</p>
          </section>
