            <p class="leading-relaxed">VocalRemover.group is an open-source, privacy-focused audio source separation platform engineered for musicians, sound designers, producers, and karaoke fans. Unlike traditional web services that upload your copyrighted audio to cloud servers and queue you behind paid subscription paywalls, our engine executes deep neural network inference directly on your device.</p><p class="leading-relaxed">By harnessing WebGPU hardware acceleration and multi-threaded WebAssembly (WASM), our system processes complex Short-Time Fourier Transforms (STFT) and multi-layer convolutional transformers on your local GPU or CPU. In browser mode, your audio stays on your device.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">How Our AI Vocal Remover Works</h2>
            <p class="leading-relaxed">Our separation pipeline is powered by Meta AI's HTDemucs (Hybrid Transformer Demucs v4) architecture—one of the highest-rated source separation models in academic audio benchmarks.</p><p class="leading-relaxed">1. Audio Analysis: The browser decodes your MP3 or WAV file using the Web Audio API into 44.1 kHz stereo sample arrays.</p><p class="leading-relaxed">2. Spectral Decomposition: An in-place Cooley-Tukey FFT slices the signal into 4096-sample windows with 75% overlap, converting raw waveforms into complex time-frequency spectrograms.</p><p class="leading-relaxed">3. Deep Neural Masking: The model evaluates both raw temporal waveforms and frequency bins, separating the audio into individual stem components (vocals, drums, bass, and accompaniment).</p><p class="leading-relaxed">4. Overlap-Add Resynthesis: Inverse STFT (iSTFT) with Hann windowing reconstructs phase-aligned, glitch-free audio, compiling isolated vocal and instrumental masters.</p>
          </section>
