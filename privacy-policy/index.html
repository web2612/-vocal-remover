        <p class="text-lg text-slate-600 max-w-2xl mx-auto">Browser processing is the default and keeps your audio on your device. When cloud processing is available, the app uploads audio only after you explicitly choose it and confirm the upload.</p>

          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">1. Browser and Cloud Audio Separation</h2>
            <p class="leading-relaxed">In browser mode, the Web Audio API decodes your track. WebGPU or WebAssembly runs the model on your device.</p><p class="leading-relaxed">In cloud mode, Cloudflare temporarily stores the audio in private storage. The service deletes the input when the job ends. The separated tracks are available for up to 15 minutes after completion. A secure session cookie limits job access to the originating browser.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">2. External Model Asset Downloads &amp; Network Disclosures</h2>
            <p class="leading-relaxed">To perform neural source separation without a paid backend, the browser downloads the open-source HTDemucs model weights (~180.5MB) from an external model host (Hugging Face CDN).</p><p class="leading-relaxed">During this download, the external model CDN receives standard technical network connection information (such as your IP address, browser User-Agent, and requested resource) to deliver the file over HTTPS. No audio data or user files are ever sent to this CDN.</p><p class="leading-relaxed">The browser can save the verified model to CacheStorage and reuse it for subsequent separations.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">3. What Data We Collect (and What We Do Not)</h2>
            <p class="leading-relaxed">• Cloud jobs use the audio to fulfill your separation request. Browser jobs keep the audio on your device.</p><p class="leading-relaxed">• We DO NOT require user registration, passwords, email signups, or payment details.</p><p class="leading-relaxed">• Web Server Technical Logs: Like all web pages served through Cloudflare Pages, standard edge CDN connection logs are processed for DDoS mitigation and infrastructure security.</p><p class="leading-relaxed">• Email Support: If you contact us at contact@vocalremover.group, your email address is used solely to respond to your technical inquiry and is never sold or used for marketing.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">Browser Storage and Local Caching</h2>
            <p class="leading-relaxed">The app saves your latest accepted file and its details to IndexedDB so it can be restored within five minutes. The record expires after five minutes and is removed while the app is active or when you next open it. Changing the file or resetting the tool clears the saved record.</p><p class="leading-relaxed">The model cache is separate from the selected file.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">4. Third-Party Services and Analytics</h2>
            <p class="leading-relaxed">We do not sell, rent, or monetize your personal information or audio files. There are no third-party advertising trackers or invasive behavioral analytics scripts embedded on this website.</p>
          </section>
        
          <section class="space-y-3">
            <h2 class="text-2xl font-bold text-slate-900">5. Data Security and Web Sandboxing</h2>
            <p class="leading-relaxed">Web browsers execute client-side JavaScript within a secure sandbox that prevents unauthorized access to your local filesystem. You have full control over the audio files you select, and object URLs are revoked immediately upon session reset.</p>
